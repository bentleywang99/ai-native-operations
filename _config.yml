theme: jekyll-theme-cayman
title: The AI-Run Company
description: How a company runs when agents do the work and humans stay on the loop. By Bentley Wang and Marty Chang.
url: https://handbook.stacknative.ai
plugins:
  - jekyll-sitemap

# Every link we hand out previewed as bare text: the handbook had no og:image at all.
# Rendered from tools/browser/og-card.html?v=handbook (viewport 1200x630, crop 1200:630:0:0).
# jekyll-seo-tag reads page.image, not site.image, so the card is set as a Jekyll default
# across every page rather than repeated in sixteen files of front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /og.png
twitter:
  card: summary_large_image

# Build inputs and run logs, not pages. method/prompt-template.md was being published with its
# {{VERSION}} and {{BOOK_URL}} placeholders eaten by Liquid, so the live page read "It is public
# at ." — the compiled prompt is what runs, and the source stays readable in the public repo.
# scenarios/results.md is a regression-run log. Both were in the sitemap by accident of being .md.
exclude:
  - method
  - ops
  - scenarios/results.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
